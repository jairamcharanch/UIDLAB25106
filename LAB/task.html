<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
</head>
<body>
    <script>
        function even(){
            for(var i =2;i<=10;i++){
                if(i%2==0){
                    document.write(i);
                    document.write("<br>");
                }
            }
        }
        function odd(){
            for(var i =1;i<=10;i++){
                if(i%2!=0){
                    document.write(i);
                    document.write("<br>");
                }
            }
        }
    </script>
    <button type="button" onclick="even()">even numbers</button>
    <br>
    <br>
    <button type="button" onclick="odd()">odd numbers</button>
    
</body>
</html>
