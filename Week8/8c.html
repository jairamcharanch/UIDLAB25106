<!DOCTYPE html>
<html>
    <head>
        <title>8b</title>
        <style>
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: wheat;
        }
       .ball{
            width:100px;
            height:100px;
            background:linear-gradient(100deg,maroon,brown);
            border:1px solid black;
            position:absolute;
            border-radius: 50%;
            animation: animation1;
            animation-duration:5s;
            animation-delay: 1s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
        }
        @keyframes animation1{
            0%{transform : translateX(0px) rotate(0deg)}
            25%{transform : translateX(-200px) rotate(360deg)}
            50%{transform : translateX(0px) rotate(720deg)}
            75%{transform: translateX(200px) rotate(1080deg)}
            100%{transform :translateX(0px) rotate(1460deg)}
        }
        
    </style>
    </head>
    <body>
        <p style="text-align: center;color:red;font-size: large;">My name is CH. JAI RAM CHARAN,Roll no - 25106,Sec:CSE-B.</p>
        <div class="container">
            <div class="ball"></div>
        </div>

    </body>
</html>
