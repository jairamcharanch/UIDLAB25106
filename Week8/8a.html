        body{

        .square{
            width:100px;
            height:100px;
            background-color:brown;
            position:relative;
            border-radius: 5px;
            animation: squareani;
            animation-duration:4s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            box-shadow: 0 0 5px;
            margin-top: 100px;
        }
        @keyframes squareani{
            from{transfrom : rotate(0deg);}
            to{transform: rotate(360deg);}
        }
    </style>
