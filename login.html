<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: black;
    color: white;
    font-family: Arial, sans-serif;
}
.logo {
    font-size: 36px;
    font-weight: bold;
    color: orange;
    text-align: center;
    margin-top: 10px;
    padding-bottom: 70px;
}

.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 50px;
}


h1 {
    font-size: 36px;
    margin-bottom: 60px;
}

.label {
    width: 500px;
    color: gray;
    margin-bottom: 10px;
}

input {
    width: 500px;
    background: transparent;
    border: none;
    border-bottom: 2px solid gray;
    padding: 10px 0;
    color: white;
    font-size: 14px;
    outline: none;
}
input:focus {
    border-bottom: 2px solid orange;
}

button {
    width: 500px;
    margin-top: 60px;
    padding: 15px;
    border-radius: 40px;
    border: 2px solid #555;
    background: black;
    color: #777;
    font-size: 16px;
    cursor: pointer;
}

.links {
    margin-top: 30px;
}

.links a {
    color: orange;
    text-decoration: none;
    font-weight: bold;
    margin: 0 10px;
}
</style>

</head>

<body>

<div class="container">
    <h1 class="logo">Crunchyroll mini</h1>

    <h1>Log In</h1>

    <div class="label">Email or Phone Number</div>
    <input type="text" id="userInput">
    <button onclick="validateInput()">Next</button>
    <div id="result"></div>

    <div class="links">
        <a href="https://sso.crunchyroll.com/reset-password?return_url=%2Fauthorize%3Fclient_id%3Dkmj7imhjt_q90lcbzzsj%26redirect_uri%3Dhttps%253A%252F%252Fwww.crunchyroll.com%252Fcallback%26response_type%3Dcookie%26state%3D%252Fdiscover">FORGOT PASSWORD?</a> |
        <a href="https://sso.crunchyroll.com/register?return_url=%2Fauthorize%3Fclient_id%3Dkmj7imhjt_q90lcbzzsj%26redirect_uri%3Dhttps%253A%252F%252Fwww.crunchyroll.com%252Fcallback%26response_type%3Dcookie%26state%3D%252Fdiscover">CREATE ACCOUNT</a>
    </div>

</div>
  <script>

    function validateInput(){

      let value = document.getElementById("userInput").value;

      let result = document.getElementById("result");

      let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      let phonePattern = /^[0-9]{10}$/;

      if(emailPattern.test(value)){

        result.innerHTML = "Valid Email Address";
        result.style.color = "green";

      }

      else if(phonePattern.test(value)){

        result.innerHTML = "Valid Phone Number";
        result.style.color = "green";

      }

      else{

        result.innerHTML = "Invalid Email or Phone Number";
        result.style.color = "red";

      }

    }

  </script>


</body>
</html>
