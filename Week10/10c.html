<!DOCTYPE html>
<html>
<head>
    <title>Largest of 5 Numbers</title>
    <style>
        body{
            background-color: bisque;
        }
        form {
            background-color: wheat;
            padding: 20px;
            margin: auto;
            width: 300px;
            border-radius: 10px;
        }
    </style>
    <script>
        function findLargest() {
            let n1 = parseFloat(document.getElementById("num1").value);
            let n2 = parseFloat(document.getElementById("num2").value);
            let n3 = parseFloat(document.getElementById("num3").value);
            let n4 = parseFloat(document.getElementById("num4").value);
            let n5 = parseFloat(document.getElementById("num5").value);

            let largest = n1;

            if (n2 > largest) largest = n2;
            if (n3 > largest) largest = n3;
            if (n4 > largest) largest = n4;
            if (n5 > largest) largest = n5;

            alert("The largest number is: " + largest);
        }
    </script>
</head>
<body>
    <p style="text-align: center;color:red;font-size: large;">My name is CH. JAI RAM CHARAN,Roll no - 25106,Sec:CSE-B.</p>
    <form>
    <h2>Find Largest of 5 Numbers</h2>

    Enter Number 1: <input type="text" id="num1"><br><br>
    Enter Number 2: <input type="text" id="num2"><br><br>
    Enter Number 3: <input type="text" id="num3"><br><br>
    Enter Number 4: <input type="text" id="num4"><br><br>
    Enter Number 5: <input type="text" id="num5"><br><br>

    <button onclick="findLargest()">Find Largest</button>
    </form>
</body>
</html>
