<!DOCTYPE html>
<html>
<head>
    <title>Sort Three Numbers</title>
    <style>
        body{
            background-color: bisque;
        }
        form {
            background-color: wheat;
            padding: 20px;
            margin: auto;
            width: 300px;
            border-radius: 10px;
        }
    </style>
    <script>
        function sortNumbers() {
            let a = parseInt(prompt("Enter first number:"));
            let b = parseInt(prompt("Enter second number:"));
            let c = parseInt(prompt("Enter third number:"));

            let temp;

            if (a > b) {
                temp = a;
                a = b;
                b = temp;
            }

            if (a > c) {
                temp = a;
                a = c;
                c = temp;
            }

            if (b > c) {
                temp = b;
                b = c;
                c = temp;
            }

            alert("Sorted numbers: " + a + ", " + b + ", " + c);
        }
    </script>
</head>
<body>
    <p style="text-align: center;color:red;font-size: large;">My name is CH. JAI RAM CHARAN,Roll no - 25106,Sec:CSE-B.</p>
    <form>
    <h2>Find the Sorted List</h2>
    <button onclick="sortNumbers()">Sort Numbers</button>
    </form>
</body>
</html>
