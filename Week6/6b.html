<!DOCTYPE html>
<html>
  <head>
    <style>
      body{
        margin: 0;
        background-color: bisque;
      }
      .main{
        display: grid;
        grid-template-areas:
        "Header Header"
        "Sidebar Product"
        "Sidebar Product"
        "footer footer";
        gap: 15px;
        grid-template-columns:250px 1fr;
      }
      .header{
        grid-area:Header;
        background-color:#1F2937;
        text-align: center;
      }
      .header h1{
        color: lightseagreen;
      }

      .sidebar{
        grid-area:Sidebar;
        height: auto;
        background-color: lightgoldenrodyellow;
        padding: 5px;
      }
  
      .sidebar h3{
        margin-bottom: 0;
      }
      .sidebar p{
        border-bottom: 1px solid rgb(161, 154, 154);
        padding: 10px;
        cursor: pointer;
        margin-top: 0;
        margin-bottom: 0;
      }
      .sidebar a{
        text-decoration: none;
        color: black;
      }
      iframe{
        width: 100%;
        height: 730px;
        border: none;
      }
      .card{
        box-shadow: 0px 0px 10px;
        background-color: lightblue;
        text-align: center;
        border-radius:10px;
      }
 
      .card img{
        width:200px;
        margin: 5px;
        
      }
      .card button{
        background:#2563EB;
        color:white;
        border:none;
        padding:8px 15px;
        border-radius:5px;
        cursor:pointer;
      }
      .card button:hover{
        background:#1D4ED8;
      }
      .footer{
        grid-area: footer;
        background-color:black;
        color:ghostwhite;
        text-align:center;
        padding:15px;
      }
    </style>
  </head>
  <body>
    <p style="text-align: center;color:red;font-size: large;">My name is CH. JAI RAM CHARAN,Roll no - 25106,Sec:CSE-B.</p>
    <div class="main">
      <div class="header">
        <h1>Anime Store</h1>
      </div>
      <div class="sidebar">
        <h3>Category</h3>
        <p>
          <a href="manga.html" target="nav">Manga</a>
        </p>
        <p>
          <a href="items.html" target="nav">Items</a>
        </p>
        <p>
          <a href="clothes.html" target="nav">Clothes</a>
        </p>
        <p>
          <a href="accessories.html" target="nav">Accessories</a>
        </p>
      </div>
      <div>
        <iframe name="nav"></iframe>
      </div>
      <div class="footer">
        <p>© 2026 Electronics Store | All Rights Reserved</p>
      </div>
    </div>
  </body>
</html>
