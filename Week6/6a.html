<!DOCTYPE html>
<html>
  <head>
    <style>
      body{
        margin: 0;
        background-color:bisque;
      }
      .main{
        display: grid;
        grid-template-areas:
        "Header Header"
        "Sidebar Products"
        "Sidebar Products"
        "footer footer";
        gap: 15px;
        grid-template-columns:250px 1fr;
      }
      .header{
        grid-area:Header;
        background-color:lightseagreen;
        text-align: center;
      }
      .header h1{
        color: ghostwhite;
      }
        
 
      .sidebar{
        grid-area:Sidebar;
        height: auto;
        background-color: lightgoldenrodyellow;
        padding: 5px;
      }
  
      .sidebar h3{
        margin-bottom: 0;
      }
      .sidebar p{
        border-bottom: 1px solid rgb(161, 154, 154);
        padding: 10px;
        cursor: pointer;
        margin-top: 0;
        margin-bottom: 0;
      }
      .products{
        grid-area: Products;
        display: grid;
        grid-template-columns: repeat(2,1fr);
        gap: 20px;
        padding: 20px;
      }
      .card{
        box-shadow: 0px 0px 10px;
        background-color:lightblue;
        text-align: center;
        border-radius:10px;
      }
      .card img{
        width:200px;
        margin: 5px;
        
      }
      .card button{
        background:#2563EB;
        color:white;
        border:none;
        padding:8px 15px;
        border-radius:5px;
        cursor:pointer;
      }
      .card button:hover{
        background:#1D4ED8;
      }
      .footer{
        grid-area: footer;
        background-color:black;
        color:ghostwhite;
        text-align:center;
        padding:15px;
      }
    </style>
  </head>
  <body>
    <p style="text-align: center;color:red;font-size: large;">My name is CH. JAI RAM CHARAN,Roll no - 25106,Sec:CSE-B.</p>
    <div class="main">
      <div class="header">
        <h1>Anime Store</h1>
      </div>
      <div class="sidebar">
        <h3>Category</h3>
        <p>Manga</p>
        <p>Items</p>
        <p>Clothes</p>
        <p>Accessories</p>
      </div>
      <div class="products">
        <div class="card">
          <img src="one piece cover page.jpg">
          <h3>One Piece</h3>
          <p>$30</p>
          <button>Buy now</button>
        </div>
        <div class="card">
          <img src="demon slayer manga cover page.webp">
          <h3>Demon Slayer</h3>
          <p>$25</p>
          <button>Buy now</button>
        </div>
        <div class="card">
          <img src="jjk cover page.jpg">
          <h3>JJk</h3>
          <p>$28</p>
          <button>Buy now</button>
        </div>
        <div class="card">
          <img src="naruto cover page.jpg">
          <h3>Naruto</h3>
          <p>$24</p>
          <button>Buy now</button>
        </div>
      </div>
      <div class="footer">
        <p>© 2026 Anime Store | All Rights Reserved</p>
      </div>
    </div>
</body>
</html>
