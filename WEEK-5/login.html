<!DOCTYPE html>
<html>
    <body>
        <h1>Login</h1>
        <table>
            <form>
                <tr>
                    <td>
                    <input type="text" id="email" placeholder="Email">
                    </td>
                    <td>
                    <label for="email">Email</label>
                    </td>
                </tr>
                <tr>
                    <td>
                    <input type="text" id="pwd" placeholder="Password">
                    </td>
                    <td>
                    <label for="pwd">Password</label>
                    </td>
                </tr>
                <tr>
                    <td>
                    <input type="checkbox" value="Saveme">Saveme</input>
                    </td>
                    <td>
                    <a href="">Forgot password?</a>
                    </td>
                </tr>
                <tr>
                <td>
                <button type="button" onclick="alert('login successful')">Login</button>
                </td>
                </tr>
                <tr>
                    <td>
                    <p>Don't have a account?</p>
                    </td>
                    <td>
                    <a href="">Register</a>
                    </td>
                </tr>
            </form>
        </table>
    </body>
</html>
