<!DOCTYPE html>
<html>
<head>
    <title>Username Validation</title>
</head>
<body style="background-color: bisque;">
    <p style="text-align: center;color:red;font-size: large;">My name is CH. JAI RAM CHARAN,Roll no - 25106,Sec:CSE-B.</p>
    <h2>Enter Username</h2>
    <input type="text" id="username" onkeyup="checkUsername()" placeholder="Enter username">
    <p id="message"></p>

    <script>
        function checkUsername() {
            let username = document.getElementById("username").value;
            let message = document.getElementById("message");

            if (username.length < 5) {
                message.textContent = "Username must be at least 5 characters";
                message.style.color = "red";
            } else {
                message.textContent = "Username looks good!";
                message.style.color = "green";
            }
        }
    </script>

</body>
</html>
